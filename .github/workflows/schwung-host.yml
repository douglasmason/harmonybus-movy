name: Schwung host compatibility
on:
  pull_request:
    branches: [main]
    paths: ['integration/schwung-host/**', 'scripts/patch_settings_case.py', 'scripts/test_schwung_shared_source.py', 'scripts/patch_running_transport.py', '.github/workflows/schwung-host.yml']
  push:
    branches: [main]
    paths: ['integration/schwung-host/**', 'scripts/patch_settings_case.py', 'scripts/test_schwung_shared_source.py', 'scripts/patch_running_transport.py', '.github/workflows/schwung-host.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: charlesvestal/schwung
          ref: a6f7ec9e5cf4d0df172a1dbc00b29d0b5eb67124
          path: schwung-173
      - uses: actions/checkout@v4
        with:
          repository: charlesvestal/schwung
          ref: 35f401c3876557606ee44fbc9f3e363a6e39fb84
          path: schwung-182
      - run: python3 scripts/test_schwung_shared_source.py schwung-173 schwung-182
      - name: Verify upstream behavior relied on by the integration
        working-directory: schwung-182
        run: |
          set -e
          for suite in test_sampler_get_bpm test_midi_monitor_cable0_only test_standalone_single_launch test_tool_launch_standalone test_master_fx_user_presets test_send_fx_user_presets test_remote_ui_chain_positions test_visible_if_replan_no_host_reads; do
            bash "tests/host/$suite.sh"
          done
