name: Build HarmonyBus Movy clean

on:
  push:
    branches: [clean-hb]
  pull_request:
    branches: [clean-hb]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: harmonybus-movy-clean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REF: 5c01a4fe7745b730ee98111194fc64328ea2659b
  SCHWUNG_REF: c2e9434ef1f588ea174a6680fafe5251e2228f5c
  HB_REF: 6d63ad7b80f40542397fe4c35559e4ee5c1e31a4
  HB_MOVY_VERSION: 0.34.1-hbclean.143
  HB_MOVY_TAG: v0.34.1-hbclean.143
  ASSET_NAME: harmonybus-movy-module.tar.gz
  SCHWUNG_ROOT: ${{ github.workspace }}/schwung

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CI promotion invariants
        run: python3 scripts/test_ci_release.py

      - name: Select checks and recover tested release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_release.py plan movy

      - name: Install aarch64 toolchain
        if: steps.plan.outputs.mode == 'full'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          sudo ln -sf "$(command -v aarch64-linux-gnu-gcc)" /usr/local/bin/aarch64-unknown-linux-gnu-gcc
          sudo ln -sf "$(command -v aarch64-linux-gnu-nm)" /usr/local/bin/aarch64-unknown-linux-gnu-nm
          sudo ln -sf "$(command -v aarch64-linux-gnu-strip)" /usr/local/bin/aarch64-unknown-linux-gnu-strip
          rustup target add aarch64-unknown-linux-gnu

      - name: Clone pinned upstream Movy
        if: steps.plan.outputs.mode != 'reused'
        run: |
          git clone https://github.com/DimaDake/schwung-movy.git movy
          cd movy
          git checkout "$UPSTREAM_REF"

      - name: Clone Schwung for upstream ABI and palette checks
        if: steps.plan.outputs.mode != 'reused'
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/charlesvestal/schwung.git schwung
          git -C schwung checkout "$SCHWUNG_REF"

      - name: Apply clean HarmonyBus integration
        if: steps.plan.outputs.mode != 'reused'
        run: python3 scripts/apply_clean_harmonybus.py movy

      - name: Test prepared states with the actual HarmonyBus loader
        if: steps.plan.outputs.mode != 'reused'
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/douglasmason/harmonybus.git harmonybus
          git -C harmonybus checkout "$HB_REF"
          python3 scripts/verify_harmonybus_defaults.py movy harmonybus

      - name: Verify clean scope and defaults
        if: steps.plan.outputs.mode != 'reused'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('movy')
          changed = subprocess.check_output(
              ['git', '-C', str(root), 'diff', '--name-only'], text=True
          ).splitlines()
          changed += subprocess.check_output(
              ['git', '-C', str(root), 'ls-files', '--others', '--exclude-standard'], text=True
          ).splitlines()
          expected = {
              'browser-test/hb-motifs.mjs',
              'browser-test/hb-step-modes.mjs',
              'src/renderer/hb-step-panels.ts',
              'src/renderer/header.ts',
              'src/seq/duplicate.ts',
              'src/seq/router-buttons.ts',
              'engine/crates/seq-core/src/hb_render_rhythm.rs',
              'src/renderer/hb-motif.ts',
              'src/renderer/hb-approach.ts',
              'src/renderer/knob-leds.ts',
              'src/renderer/motif-feedback.ts',
              'src/seq/step-rec-target.ts',
              'src/seq/step-rec-view.ts',
              'src/seq/step-rec.ts',

              'src/model/wav-peaks.ts',  # bound background read work per UI tick
              'browser-test/perf.mjs',  # paired warm-up for the existing scaling budget
              'src/app/init.ts',
              'src/app/state.ts',
              'browser-test/logic/session-shift.mjs',  # destination startup view is now Knobs
              'src/keyboard/layouts.ts',
              'browser-test/screenshots/baseline/main-mode-overlay.png',
              'browser-test/screenshots/baseline/main-layout-overlay.png',
              'build/browser.mjs',  # expose the real app tick to release-latency tests
              'src/chain/set-param.ts',
              'src/undo/apply.ts',
              'src/seq/tempo-override.ts',
              'browser-test/hb-data-survival.mjs',
              'scripts/lib/test-set.sh',
              'scripts/test-chains.sh',
              'scripts/test-mutes.sh',
              'scripts/test-seq.sh',
              'scripts/recover-sets.mjs',
              'scripts/test-versions.sh',
              'browser-test/logic/seq-leds.mjs',
              'browser-test/logic/old-set.mjs',
              'browser-test/logic/set-state.mjs',
              'browser-test/logic/versions.mjs',
              'src/seq/set-context.ts',
              'src/seq/prefs.ts',
              'src/seq/scales.ts',
              'browser-test/logic/keyboard.mjs',
              'src/mixer/track-volume.ts',
              'browser-test/logic/track-volume.mjs',
              'src/seq/pads.ts',
              'src/seq/step-edit.ts',
              'src/seq/router.ts',
              'browser-test/logic/seq-edit.mjs',
              'src/undo/ui-fields.ts',
              'src/seq/main-page.ts',
              'src/seq/main-page-vm.ts',
              'browser-test/logic/params-pages.mjs',
              'src/keyboard/harmony-pads.ts',
              'src/keyboard/handler.ts',  # immediate Play Color matches periodic LEDs
              'src/keyboard/pad-palette.ts',
              'browser-test/hb-pad-colors.mjs',
              'browser-test/hb-input-info.mjs',
              'src/seq/input-info.ts',
              'browser-test/screenshot.mjs',
              'browser-test/screenshots/baseline/main-default.png',
              'browser-test/screenshots/baseline/main-tempo-touched.png',
              'browser-test/screenshots/baseline/main-swing-touched.png',
              'browser-test/screenshots/baseline/main-root-touched.png',
              'browser-test/screenshots/baseline/main-key-overlay.png',
              'browser-test/screenshots/baseline/main-mode-overlay.png',
              'browser-test/screenshots/baseline/main-layout-overlay.png',
              'browser-test/screenshots/baseline/main-ext-sync.png',
              'browser-test/screenshots/baseline/main-link-on.png',
              'browser-test/screenshots/baseline/main-quant.png',


              'src/track/switch.ts',
              'browser-test/hb-track-navigation.mjs',
              'src/track/pad-route.ts',
              'engine/crates/movy-dsp/src/pad_route.rs',
              'src/seq/ui-state.ts',
              'src/seq/engine.ts',
              'src/seq/constants.ts',
              'src/seq/leds.ts',
              'src/seq/led-cache.ts',
              'src/types/schwung.d.ts',
              'src/seq/ui-dirty.ts',
              'src/seq/set-save.ts',
              'src/seq/set-session.ts',
              'src/seq/colors.ts',
              'src/seq/native-track-colors.ts',
              'src/app/resume.ts',
              'browser-test/native-track-colors.mjs',
              'browser-test/logic/set-session.mjs',
              'src/seq/clip-page.ts',
              'src/seq/clip-page-vm.ts',
              'src/undo/verbs.ts',
              'engine/crates/seq-core/src/lib.rs',
              'engine/crates/seq-core/src/follower_input.rs',
              'engine/crates/seq-core/src/humanize.rs',
              'engine/crates/seq-core/src/recorded_actions.rs',
              'engine/crates/seq-core/src/capture.rs',
              'engine/crates/seq-core/src/hb_clip_performance.rs',
              'engine/crates/seq-core/src/command.rs',
              'engine/crates/seq-core/src/clip_tools.rs',
              'browser-test/hb-clip-tools.mjs',
              'browser-test/screenshots/baseline/clip-default.png',
              'browser-test/screenshots/baseline/clip-drum.png',
              'browser-test/screenshots/baseline/clip-fraction.png',
              'browser-test/screenshots/baseline/clip-quant.png',
              'browser-test/screenshots/baseline/clip-undo-toast.png',
              'browser-test/screenshots/baseline/quant-overlay-three.png',
              'browser-test/screenshots/baseline/quant-overlay-two.png',
              'src/renderer/schwung-grid.ts',
              'src/renderer/schwung-page.ts',
              'src/renderer/performance-touch.ts',
              'src/renderer/hb-performance.ts',
              'src/seq/flags-def.ts',
              'src/seq/flags-page.ts',
              'browser-test/logic/flags.mjs',
              'browser-test/screenshots/baseline/flags-release.png',
              'browser-test/screenshots/baseline/flags-scrolled.png',
              'src/app/input-reset.ts',
              'src/app/unload.ts',
              'src/renderer/knob-view.ts',
              'src/app/tick.ts',
              'src/midi/router.ts',
              'engine/crates/seq-core/src/engine.rs',
              'engine/crates/seq-core/src/clip.rs',
              'engine/crates/seq-core/src/persist.rs',
              'engine/crates/movy-dsp/src/lib.rs',
              'engine/crates/movy-dsp/src/chain_host.rs',
              'engine/crates/movy-dsp/src/host.rs',
              'engine/crates/movy-dsp/src/chain_slots.rs',
              'engine/crates/movy-dsp/src/hb_loop.rs',
              'engine/crates/movy-dsp/src/hb_record.rs',
              'browser-test/hb-touch.mjs',
              'browser-test/hb-analysis.mjs',
              'src/model/store.ts',
              'src/model/viewmodel.ts',
              'browser-test/logic/tracks-chain.mjs',
              'browser-test/logic/tracks-refs.mjs',
              'browser-test/logic/seq-engine.mjs',
              'browser-test/logic/seq-leds.mjs',
              'browser-test/app-loop.mjs',
              'browser-test/abi-parity.mjs',
              'browser-test/track-colors.mjs',
          }
          assert set(changed) == expected, (changed, expected)

          state = (root / 'src/seq/ui-state.ts').read_text()
          router = (root / 'src/midi/router.ts').read_text()
          grid = (root / 'src/renderer/schwung-grid.ts').read_text()
          engine = (root / 'engine/crates/seq-core/src/engine.rs').read_text()
          persist = (root / 'engine/crates/seq-core/src/persist.rs').read_text()

          assert "{ c: 'midi_fx1', m: 'harmonybus'" in state
          assert "{ c: 'synth', m: 'plaits' }" in state
          assert "mix: '1.0000,0.0000,1,0.0000,0.0000'" in state
          assert "HB_FRESH_CONDUCTOR" in state
          assert state.count("'hb16,1,0,0,25,2,0,0,0,0,0,0,") >= 3
          assert "loadSetHostChoice(null);" in state
          assert "restoreChains(freshHarmonyBusChains(), null)" in state
          assert "let override: SchwungGridMode | null = 'page';" in grid
          assert "if (sp2) { sp2.knobTouch(d1, true); appState.dirty = true; }\n                else m2?.handleKnobTouch(d1);" in router
          assert "if (sp2) { sp2.knobTouch(d1, false); appState.dirty = true; }\n                else if (m2?.handleKnobRelease(d1))" in router
          assert "openSchwungEditor(intent, spc)" not in router
          assert "link_enabled: true," in engine
          assert "engine.link_enabled = true;" in persist

          # Recording intercepts private packets only; preserve the working Render To route.
          host = (root / 'engine/crates/movy-dsp/src/chain_host.rs').read_text()
          assert 'fn hb_record_inject' in host
          assert 'fn shim_inject_to_move' not in host
          print('clean scope/defaults verified')
          PY

      - name: Stamp module metadata
        if: steps.plan.outputs.mode != 'reused'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('movy/module.json')
          data = json.loads(path.read_text())
          data['version'] = '${{ env.HB_MOVY_VERSION }}'
          data['name'] = '01 Movy (HarmonyBus Clean)'
          data['description'] = 'Stock Movy with HarmonyBus sources and four instrument-free receivers, muted local outputs, Schwung-owned parameter UI, and native Move transport follow enabled by default'
          path.write_text(json.dumps(data, indent=4) + '\n')
          PY

      - name: Install Movy dependencies
        if: steps.plan.outputs.mode != 'reused'
        working-directory: movy
        run: npm install

      - name: Build browser test bundle
        if: steps.plan.outputs.mode != 'reused'
        working-directory: movy
        run: node build/browser.mjs

      - name: Upstream test — logic
        if: steps.plan.outputs.mode == 'full'
        working-directory: movy
        run: node browser-test/logic.mjs

      - name: Verify motif editor and feedback
        if: steps.plan.outputs.mode != 'reused'
        working-directory: movy
        run: node browser-test/hb-motifs.mjs

      - name: Verify harmony pad colors
        if: steps.plan.outputs.mode != 'reused'
        working-directory: movy
        run: node browser-test/hb-pad-colors.mjs

      - name: Verify clip action UI and Undo
        if: steps.plan.outputs.mode != 'reused'
        working-directory: movy
        run: |
          node browser-test/hb-clip-tools.mjs
          node browser-test/hb-input-info.mjs

      - name: Verify user data survives custom reinstall
        if: steps.plan.outputs.mode == 'full'
        working-directory: movy
        run: node browser-test/hb-data-survival.mjs

      - name: Upstream test — track colors
        if: steps.plan.outputs.mode == 'full'
        working-directory: movy
        run: |
          node browser-test/track-colors.mjs
          node browser-test/native-track-colors.mjs

      - name: Upstream test — ABI parity
        if: steps.plan.outputs.mode == 'full'
        working-directory: movy
        run: node browser-test/abi-parity.mjs

      - name: Upstream test — dump replay
        if: steps.plan.outputs.mode == 'full'
        working-directory: movy
        run: node browser-test/dump-replay.mjs

      - name: Upstream test — app loop
        if: steps.plan.outputs.mode == 'full'
        working-directory: movy
        run: node browser-test/app-loop.mjs

      - name: Upstream test — screenshot
        if: steps.plan.outputs.mode == 'full'
        working-directory: movy
        run: node browser-test/screenshot.mjs

      - name: Upstream test — perf
        if: steps.plan.outputs.mode == 'full'
        working-directory: movy
        run: node browser-test/perf.mjs

      - name: Upstream test — device scripts
        if: steps.plan.outputs.mode == 'full'
        working-directory: movy
        run: node browser-test/device-scripts.mjs

      - name: Typecheck and build UI
        if: steps.plan.outputs.mode != 'reused'
        working-directory: movy
        run: |
          npm run typecheck
          npm run build:device

      - name: Test native sequencer and transport
        if: steps.plan.outputs.mode == 'full'
        working-directory: movy/engine
        run: |
          cargo test -p seq-core --lib
          cargo test -p movy-dsp piano_gap_tests --lib
          HB_TIMING_TRACE=/tmp/hb-timing.trace cargo test -p movy-dsp hb_loop --lib

      - name: Replay real sequencer timing through HarmonyBus
        if: steps.plan.outputs.mode == 'full'
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wno-format-zero-length -O1 -I harmonybus tests/follower_trace.c harmonybus/src/harmony_core.c -lm -o /tmp/hb-trace
          /tmp/hb-trace /tmp/hb-timing.trace

      - name: Exercise the full native audio and recording chain
        if: steps.plan.outputs.mode == 'full'
        run: bash scripts/test_full_chain_audio.sh movy harmonybus schwung

      - name: Verify HB knob touch with the real Schwung controller
        if: steps.plan.outputs.mode != 'reused'
        working-directory: movy
        run: |
          SCHWUNG="$SCHWUNG_ROOT" node build/browser.mjs
          HB_MODULE="$GITHUB_WORKSPACE/harmonybus/modules/harmonybus/module.json" node browser-test/hb-track-navigation.mjs
          HB_MODULE="$GITHUB_WORKSPACE/harmonybus/modules/harmonybus/module.json" node browser-test/hb-step-modes.mjs
          HB_MODULE="$GITHUB_WORKSPACE/harmonybus/modules/harmonybus/module.json" node browser-test/hb-touch.mjs
          HB_MODULE="$GITHUB_WORKSPACE/harmonybus/modules/harmonybus/module.json" node browser-test/hb-analysis.mjs

      - name: Build Movy DSP
        if: steps.plan.outputs.mode == 'full'
        working-directory: movy
        run: ./scripts/build-dsp.sh

      - name: Package module
        if: steps.plan.outputs.mode == 'full'
        run: |
          rm -rf package
          mkdir -p package/movy/configs
          cp movy/module.json movy/ui.js movy/dist/dsp.so package/movy/
          cp movy/src/module-configs/*.json package/movy/configs/
          tar -czf "$ASSET_NAME" -C package movy
          tar -tzf "$ASSET_NAME" | head -100

      - name: Verify branch release manifest
        if: steps.plan.outputs.mode == 'full'
        run: |
          python3 - <<'PY'
          import json
          r = json.load(open('release.json'))
          assert r['version'] == '${{ env.HB_MOVY_VERSION }}'
          expected = 'https://github.com/douglasmason/harmonybus-movy/releases/download/${{ env.HB_MOVY_TAG }}/${{ env.ASSET_NAME }}'
          assert r['download_url'] == expected
          print('release manifest verified')
          PY

      - name: Seal comprehensive release artifact
        if: steps.plan.outputs.mode == 'full'
        run: python3 scripts/ci_release.py seal movy

      - name: Preserve tested device package
        if: steps.plan.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-release
          path: ci-release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish clean release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$HB_MOVY_TAG" >/dev/null 2>&1; then
            gh release upload "$HB_MOVY_TAG" "$ASSET_NAME" --clobber
          else
            gh release create "$HB_MOVY_TAG" "$ASSET_NAME" \
              --target "$GITHUB_SHA" \
              --title "HarmonyBus Movy $HB_MOVY_VERSION" \
              --notes "Includes HarmonyBus 0.2.233: Next Pulse follows the displayed chord form, and detected source forms preserve power, shell and rootless voicings without losing inferred harmonic identity."
          fi
          if [ "$(gh release view "$HB_MOVY_TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$HB_MOVY_TAG" --draft=false --target "$GITHUB_SHA" || test "$(gh release view "$HB_MOVY_TAG" --json isDraft --jq .isDraft)" = false
          fi
          test "$(gh release view "$HB_MOVY_TAG" --json isDraft --jq .isDraft)" = false

      - name: Update default-branch installer pointer
        if: steps.plan.outputs.publish == 'true'
        run: |
          cp release.json "$RUNNER_TEMP/hb-movy-release.json"
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/hb-movy-store" origin/main
          cp "$RUNNER_TEMP/hb-movy-release.json" "$RUNNER_TEMP/hb-movy-store/release.json"
          git -C "$RUNNER_TEMP/hb-movy-store" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/hb-movy-store" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$RUNNER_TEMP/hb-movy-store" add release.json
          if ! git -C "$RUNNER_TEMP/hb-movy-store" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/hb-movy-store" commit -m "Update installer pointer to $HB_MOVY_VERSION"
            git -C "$RUNNER_TEMP/hb-movy-store" push origin HEAD:main
          fi
