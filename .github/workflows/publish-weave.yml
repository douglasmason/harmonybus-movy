name: Publish tested weave install point
on:
  push:
    branches: [work/publish-weave-install]
    paths: [.github/workflows/publish-weave.yml, scripts/publish_weave.py]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: 389cb190d4c2ff9494e8d81996a81e407019b2bd
      TESTED_RUN: '39455241208'
      INSTALL_VERSION: 0.34.1-hbclean.203-dev.2
      PREVIOUS_VERSION: 0.34.1-hbclean.202
      ARTIFACT_NAME: harmonybus-movy-fm1-candidate
      ASSET_NAME: harmonybus-movy-module.tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested bytes, publish release, and update installer
        run: python3 scripts/publish_weave.py
