name: Saved audio check reader

on:
  pull_request:
    paths:
      - 'tools/audio-check/**'
      - 'docs/audio-check-reader.md'
      - '.github/workflows/audio-check-reader.yml'
  push:
    branches: [main]
    paths:
      - 'tools/audio-check/**'
      - 'docs/audio-check-reader.md'
      - '.github/workflows/audio-check-reader.yml'

permissions:
  contents: read

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check report interpretation and read-only CLI
        run: python -m unittest discover -s tools/audio-check -p 'test_*.py' -v
