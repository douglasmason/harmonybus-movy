name: Movy comprehensive verification and release
on:
  push:
    branches: [main]
    paths: ['integration/**', 'scripts/**', 'tests/**', '.github/workflows/chord-play.yml']
  pull_request:
    branches: [main]
    paths: ['integration/**', 'scripts/**', 'tests/**', '.github/workflows/chord-play.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: chord-play-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  HARMONYBUS_ROOT: ${{ github.workspace }}/harmonybus
  SCHWUNG_ROOT: ${{ github.workspace }}/schwung
  SCHWUNG: ${{ github.workspace }}/schwung
  HB_MODULE: ${{ github.workspace }}/harmonybus/modules/harmonybus/module.json
jobs:
  verify-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify package promotion safeguards
        run: python3 scripts/test_candidate_release.py
      - name: Recover identical verified PR package
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/candidate_release.py plan
      - name: Verify concurrent release guard
        run: python3 scripts/test_release_base.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare pinned sources
        if: steps.plan.outputs.mode == 'full'
        run: |
          git clone https://github.com/DimaDake/schwung-movy.git movy
          git -C movy checkout 5c01a4fe7745b730ee98111194fc64328ea2659b
          git clone https://github.com/douglasmason/harmonybus.git harmonybus
          git -C harmonybus checkout "$(cat integration/harmonybus.ref)"
          python3 harmonybus/scripts/build_scale_catalog.py --check --movy .
          python3 harmonybus/scripts/build_operation_catalog.py --check --movy .
          git clone https://github.com/charlesvestal/schwung.git schwung
          git -C schwung checkout a6f7ec9e5cf4d0df172a1dbc00b29d0b5eb67124
          python3 scripts/apply_clean_harmonybus.py movy
      - name: Browser and real shared-controller regressions
        if: steps.plan.outputs.mode == 'full'
        working-directory: movy
        run: |
          npm ci
          npm run typecheck
          npm run build:browser
          node browser-test/logic.mjs
          node ../dev/local/scale-microphone.test.mjs
          node ../dev/local/harmonic-function.test.mjs
          for suite in hb-schwung-host hb-automation-contract hb-automation-lifecycle hb-parameter-ownership hb-feedback-polling hb-ui-responsiveness hb-comp-generator hb-generator-overdub hb-actor-generator hb-generator-duet hb-generator-phrases hb-generator-library hb-library-names hb-generator-restore hb-chord-discovery hb-position-highlight hb-pad-position-view hb-ui-overhead hb-ui-tick-overhead hb-settings-case hb-action-label hb-chord-settings hb-panel-catalog hb-interface-usage hb-footer-test hb-performance-controls hb-drum-gesture hb-conductor-content hb-joint-chords hb-chord-queue hb-chord-range hb-navigation-lights hb-single-conductor hb-clips-fill hb-part-library hb-clips-view hb-panel-navigation hb-chord-play hb-chord-pad-feedback hb-scale-finding hb-mode-buttons hb-queue-copy hb-pad-colors hb-song-sections hb-joint-play hb-joint-panels hb-session-modifier hb-variation hb-field hb-grid hb-fm1 hb-launchpad hb-motifs hb-motif-loader hb-clip-tools hb-input-info hb-data-survival hb-track-navigation hb-step-modes hb-pad-settings hb-touch hb-startup-host hb-analysis hb-audio-profile hb-pad-trails ; do
            node "browser-test/$suite.mjs"
          done
          # Legacy app-loop fails unchanged on the pre-routing hbclean.209 baseline.
          # Dedicated Joint/session and full logic suites cover the current UI.
          node browser-test/device-scripts.mjs
          node ../tests/field_lfo_ui.mjs .
          node ../tests/relative_operations_ui.mjs .
          node ../tests/scale_cardinality_ui.mjs .
          if test -f ../tests/field_routes_ui.mjs; then node ../tests/field_routes_ui.mjs .; fi
      - name: Native sequencer, DSP and full production chain
        if: steps.plan.outputs.mode == 'full'
        run: |
          cargo test --manifest-path movy/engine/Cargo.toml -p seq-core -p movy-dsp
          # Deterministic, ignored microbenchmark; estimates are runner-only,
          # and spectral processing lives on a demoted worker, never SPI RT.
          cargo test --release --manifest-path movy/engine/Cargo.toml -p movy-dsp chroma_cpu_comparison_benchmark -- --ignored --nocapture --test-threads=1 | tee chroma-benchmark.txt
          grep -q HB_PARENT_KEY_WITHOUT_CONDUCTOR harmonybus/modules/harmonybus/dsp/harmonybus.c
          test -f harmonybus/src/chord_queue.h
          test -f harmonybus/src/chord_queue_export.h
          grep -q HB_SELECTION_INTENT_TAG harmonybus/src/chord_selection.h
          grep -q 'key->count=hb_cp_voice_semantic' harmonybus/src/chord_selection_input.h
          bash scripts/test_full_chain_audio.sh movy harmonybus schwung
          cargo test --release --manifest-path movy/engine/Cargo.toml -p seq-core source_routing_benchmark -- --ignored --nocapture --test-threads=1 | tee source-benchmark.txt
          cargo test --release --manifest-path movy/engine/Cargo.toml -p movy-dsp hb_loop_snapshot_benchmark -- --ignored --nocapture --test-threads=1 | tee -a source-benchmark.txt
          cargo run --release --manifest-path movy/engine/Cargo.toml -p movy-dsp --example hb_context_benchmark | tee context-benchmark.txt
          cargo test --release --manifest-path movy/engine/Cargo.toml -p movy-dsp --test param_reply_allocations param_reply_benchmark -- --ignored --nocapture --test-threads=1 | tee param-reply-benchmark.txt
      - name: ARM toolchain
        if: steps.plan.outputs.mode == 'full'
        timeout-minutes: 5
        run: |
          # The Azure mirror can stream packages too slowly to hit idle timeouts.
          # Keep signed Ubuntu packages; use its primary archive on this runner.
          printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc /usr/local/bin/aarch64-unknown-linux-gnu-gcc
          sudo ln -sf /usr/bin/aarch64-linux-gnu-nm /usr/local/bin/aarch64-unknown-linux-gnu-nm
          sudo ln -sf /usr/bin/aarch64-linux-gnu-strip /usr/local/bin/aarch64-unknown-linux-gnu-strip
          rustup target add aarch64-unknown-linux-gnu
      - name: Build verified install package
        if: steps.plan.outputs.mode == 'full'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path: Path = Path('movy/module.json')
          metadata: dict = json.loads(path.read_text())
          metadata['version'] = os.environ['SOURCE_VERSION']
          path.write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          npm run build:device --prefix movy
          make -C schwung/libs/quickjs/quickjs-2025-04-26 -j2 qjs
          python3 scripts/test_device_startup.py movy schwung
          bash movy/scripts/build-dsp.sh
          mkdir -p package/movy/configs
          cp movy/module.json movy/ui.js movy/dist/dsp.so package/movy/
          cp movy/src/module-configs/*.json package/movy/configs/
          cp movy/harmonybus-core-source.json package/movy/
          file package/movy/dsp.so | grep 'ARM aarch64'
          tar -czf harmonybus-movy-module.tar.gz -C package movy
          sha256sum harmonybus-movy-module.tar.gz > SHA256SUMS
      - name: Seal verified candidate
        if: steps.plan.outputs.mode == 'full'
        run: python3 scripts/candidate_release.py seal
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.mode == 'full'
        with:
          name: verified-candidate
          path: ci-release/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified main package and advance installer last
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/candidate_release.py publish
