<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movy Follower Generators</title><style>body{margin:0;padding:16px;background:#111114;color:#eee;font:14px system-ui;color-scheme:dark}main{max-width:1100px;margin:auto}</style></head><body><main id="cloud"></main><script src="/static/schwung-remote-api.js"></script><script type="module">
import {mountGenerators} from './generator-web.mjs';
const api=window.schwungRemote;
mountGenerators({root:document.querySelector('#cloud').attachShadow({mode:'open'}),api:{send:value=>api.setParam('overtake_dsp:cloud_action',value),read:async()=>({ui:await api.getParam('overtake_dsp:cloud_ui_state'),view:await api.getParam('overtake_dsp:cloud_view')})}});
</script></body></html>
